name: Build Android

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["Code Format Check"]
    types: [ "completed" ]

permissions:
  contents: read
  packages: write

env:
  ANDROID_NDK_VERSION: "28.0.13004108"
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
  VCPKG_INSTALL_OPTIONS: "--debug"

jobs:
  build-android:
    # Allow manual runs (workflow_dispatch) and chained runs from
    # workflow_run. Manual runs have no workflow_run payload so we must not
    # gate solely on its conclusion.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.act/vcpkg
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.act/android-sdk
      ANDROID_NDK: ${{ github.workspace }}/.act/android-ndk
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Init private Live2D SDK submodule
        shell: bash
        env:
          LIVE2D_SDK_TOKEN: ${{ secrets.LIVE2D_SDK_TOKEN }}
        run: |
          RAW_SDK_FETCH_TOKEN="${LIVE2D_SDK_TOKEN:-}"
          SDK_FETCH_TOKEN="$(printf '%s' "$RAW_SDK_FETCH_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$SDK_FETCH_TOKEN" ]; then
            echo "::error::Set LIVE2D_SDK_TOKEN to a PAT that can read the private Live2D SDK submodule. The default GITHUB_TOKEN cannot read sibling private repositories."
            exit 1
          fi

          export SDK_FETCH_TOKEN
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["SDK_FETCH_TOKEN"]
          print(f"Live2D SDK token present: yes")
          print(f"Live2D SDK token length: {len(token)}")
          print(f"Live2D SDK token sha256: {hashlib.sha256(token.encode('utf-8')).hexdigest()[:12]}")

          req = urllib.request.Request(
              "https://api.github.com/repos/xiaocongyu66/KiriKiri-Live2D-SDK",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  print(f"Live2D SDK API status: {resp.status}")
                  print(f"Live2D SDK API repo: {data.get('full_name')}")
          except urllib.error.HTTPError as e:
              print(f"Live2D SDK API status: {e.code}")
              body = e.read().decode("utf-8", errors="replace")
              print(f"Live2D SDK API error: {body[:240]}")
              raise

          contents_req = urllib.request.Request(
              "https://api.github.com/repos/xiaocongyu66/KiriKiri-Live2D-SDK/contents/Core/include/Live2DCubismCore.h",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(contents_req, timeout=30) as resp:
                  print(f"Live2D SDK contents API status: {resp.status}")
          except urllib.error.HTTPError as e:
              print(f"Live2D SDK contents API status: {e.code}")
              body = e.read().decode("utf-8", errors="replace")
              print(f"Live2D SDK contents API error: {body[:240]}")
              raise
          PY

          LIVE2D_AUTH_HEADER="$(python3 - <<'PY'
          import base64
          import os
          token = os.environ["SDK_FETCH_TOKEN"]
          auth = base64.b64encode(f"x-access-token:{token}".encode("utf-8")).decode("ascii")
          print(f"AUTHORIZATION: basic {auth}")
          PY
          )"
          LIVE2D_SDK_URL="https://github.com/xiaocongyu66/KiriKiri-Live2D-SDK.git"

          git -c "http.https://github.com/.extraheader=${LIVE2D_AUTH_HEADER}" \
            ls-remote "$LIVE2D_SDK_URL" HEAD >/dev/null
          rm -rf third_party/live2d-sdk
          git -c "http.https://github.com/.extraheader=${LIVE2D_AUTH_HEADER}" \
            clone --depth 1 "$LIVE2D_SDK_URL" third_party/live2d-sdk

          test -f third_party/live2d-sdk/Core/include/Live2DCubismCore.h
          test -f third_party/live2d-sdk/Core/lib/android/arm64-v8a/libLive2DCubismCore.a
          echo "Live2D Core SDK ready."

      - name: Free disk space
        run: |
          echo "Initial disk usage:"
          df -h
      
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      
          echo "After cleanup:"
          df -h

      - name: Install Mono
        run: |
          sudo apt install ca-certificates gnupg
          sudo gpg --homedir /tmp --no-default-keyring --keyring /usr/share/keyrings/mono-official-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt update
          sudo apt install -y mono-complete

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison python3 nasm autoconf-archive autoconf automake libtool pkg-config
          
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 8.0
          echo "$HOME/.dotnet" >> $GITHUB_PATH

      - name: Setup JDK 17 (fixed version)  # 修复 520 错误，锁定版本，网络友好
        uses: actions/setup-java@v3
        with:
          java-version: '17.0.19+10'
          distribution: 'zulu'

      - name: Download Android CommandLineTools
        if: steps.commandlinetools-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -f "${{ github.workspace }}/.act/commandlinetools-linux-10406996_latest.zip" ]; then
            wget -P ${{ github.workspace }}/.act https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          fi

      - name: Cache Android Commandline Tools
        uses: actions/cache@v4.2.3
        id: commandlinetools-cache
        with:
          path: ${{ github.workspace }}/.act/commandlinetools-linux-10406996_latest.zip
          key: commandlinetools-linux-10406996_latest

      - name: Install Android SDK/NDK
        run: |
          if [ ! -d "${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin" ]; then
            unzip -d ${{ github.workspace }}/.act ${{ github.workspace }}/.act/commandlinetools-linux-10406996_latest.zip
            mkdir -p ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest
            mv ${{ github.workspace }}/.act/cmdline-tools/* ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest
          fi
          
          yes | ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${{ env.ANDROID_SDK_ROOT }} --licenses
          
          ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${{ env.ANDROID_SDK_ROOT }} \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.31.1" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Set Android SDK/NDK Env
        run: |
          if [ ! -d "${{ env.ANDROID_NDK }}" ]; then
            ln -s ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }} ${{ env.ANDROID_NDK }}
          fi

          echo "ANDROID_NDK=${{ env.ANDROID_NDK }}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${{ env.ANDROID_SDK_ROOT }}" >> $GITHUB_ENV

      - name: Setup vcpkg
        run: |
          if [ ! -d "${{ env.VCPKG_ROOT }}" ]; then
            git clone https://github.com/microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
          fi
          
          ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh

      - name: Add NuGet sources
        shell: bash
        run: |
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            sources add \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${{ github.actor }}" \
            -Password "${{ secrets.GITHUB_TOKEN }}"
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            setapikey "${{ secrets.GITHUB_TOKEN }}" \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: ${{ github.job }}-${{ matrix.os }}

      - name: Generate keystore
        run: |
          KEY_PASSWORD=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 24)
          KEY_ALIAS="ci-key"
          KEYSTORE_PASSWORD=$KEY_PASSWORD
          echo "Generated passwords:"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          echo "KEY_ALIAS=$KEY_ALIAS"
          echo "KEY_PASSWORD=$KEY_PASSWORD"
          
          keytool -genkeypair -v \
          -keystore ./platforms/android/app/sign.keystore \
          -alias $KEY_ALIAS \
          -keyalg RSA -keysize 2048 \
          -validity 10000 \
          -storepass $KEYSTORE_PASSWORD \
          -keypass $KEY_PASSWORD \
          -dname "CN=CI, OU=Dev, O=Company, L=City, ST=State, C=CN"
          
          echo "SIGN_STORE_PASS=$KEYSTORE_PASSWORD" >> ./platforms/android/app/sign.properties
          echo "SIGN_KEY_ALIAS=$KEY_ALIAS" >> ./platforms/android/app/sign.properties
          echo "SIGN_KEY_PASS=$KEY_PASSWORD" >> ./platforms/android/app/sign.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android
        run: |
          sh ./platforms/android/gradlew -p ./platforms/android --console=plain --no-daemon assemble

      - name: Upload artifacts
        if: ${{ !env.ACT && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: platforms/android/out/android/app/outputs/apk/release/*.apk
