name: Build Flutter Android

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["Code Format Check"]
    types: [ "completed" ]

permissions:
  contents: read
  packages: write

env:
  ANDROID_NDK_VERSION: "28.0.13004108"
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
  VCPKG_INSTALL_OPTIONS: "--debug"

jobs:
  build-android:
    # Allow manual runs (workflow_dispatch) and chained runs from
    # workflow_run. Manual runs have no workflow_run payload so we must not
    # gate solely on its conclusion.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.act/vcpkg
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.act/android-sdk
      ANDROID_NDK: ${{ github.workspace }}/.act/android-ndk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Fetch private Live2D SDK
        shell: bash
        env:
          LIVE2D_SDK_TOKEN: ${{ secrets.LIVE2D_SDK_TOKEN }}
        run: |
          RAW_SDK_FETCH_TOKEN="${LIVE2D_SDK_TOKEN:-}"
          SDK_FETCH_TOKEN="$(printf '%s' "$RAW_SDK_FETCH_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$SDK_FETCH_TOKEN" ]; then
            echo "::error::Set LIVE2D_SDK_TOKEN to a PAT that can read the private Live2D SDK submodule. The default GITHUB_TOKEN cannot read sibling private repositories."
            exit 1
          fi

          export SDK_FETCH_TOKEN
          LIVE2D_AUTH_HEADER="$(python3 - <<'PY'
          import base64
          import os
          token = os.environ["SDK_FETCH_TOKEN"]
          auth = base64.b64encode(f"x-access-token:{token}".encode("utf-8")).decode("ascii")
          print(f"AUTHORIZATION: basic {auth}")
          PY
          )"
          LIVE2D_SDK_URL="https://github.com/xiaocongyu66/KiriKiri-Live2D-SDK.git"

          rm -rf third_party/live2d-sdk
          GIT_TERMINAL_PROMPT=0 git -c "http.https://github.com/.extraheader=${LIVE2D_AUTH_HEADER}" \
            clone --depth 1 "$LIVE2D_SDK_URL" third_party/live2d-sdk

          test -f third_party/live2d-sdk/Core/include/Live2DCubismCore.h
          test -f third_party/live2d-sdk/Core/lib/android/arm64-v8a/libLive2DCubismCore.a
          echo "Live2D Core SDK ready."

      - name: Free disk space
        run: |
          echo "Initial disk usage:"
          df -h
      
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      
          echo "After cleanup:"
          df -h

      - name: Install Mono
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/microsoft-prod.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/mono-official-stable.list
          sudo find /etc/apt/sources.list.d -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i '/packages\.microsoft\.com/d;/download\.mono-project\.com/d' {} +
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates gnupg mono-complete

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison python3 nasm autoconf-archive autoconf automake libtool pkg-config
          
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 8.0
          echo "$HOME/.dotnet" >> $GITHUB_PATH

      - name: Setup JDK 17 (fixed version)  # 修复 520 错误，锁定版本，网络友好
        uses: actions/setup-java@v3
        with:
          java-version: '17.0.19+10'
          distribution: 'zulu'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download Android CommandLineTools
        if: steps.commandlinetools-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -f "${{ github.workspace }}/.act/commandlinetools-linux-10406996_latest.zip" ]; then
            wget -P ${{ github.workspace }}/.act https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          fi

      - name: Cache Android Commandline Tools
        uses: actions/cache@v4.2.3
        id: commandlinetools-cache
        with:
          path: ${{ github.workspace }}/.act/commandlinetools-linux-10406996_latest.zip
          key: commandlinetools-linux-10406996_latest

      - name: Install Android SDK/NDK
        run: |
          if [ ! -d "${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin" ]; then
            unzip -d ${{ github.workspace }}/.act ${{ github.workspace }}/.act/commandlinetools-linux-10406996_latest.zip
            mkdir -p ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest
            mv ${{ github.workspace }}/.act/cmdline-tools/* ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest
          fi
          
          yes | ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${{ env.ANDROID_SDK_ROOT }} --licenses
          
          ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${{ env.ANDROID_SDK_ROOT }} \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "cmake;3.31.1" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Set Android SDK/NDK Env
        run: |
          if [ ! -d "${{ env.ANDROID_NDK }}" ]; then
            ln -s ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }} ${{ env.ANDROID_NDK }}
          fi

          echo "ANDROID_NDK=${{ env.ANDROID_NDK }}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${{ env.ANDROID_SDK_ROOT }}" >> $GITHUB_ENV

      - name: Setup vcpkg
        run: |
          if [ ! -d "${{ env.VCPKG_ROOT }}" ]; then
            git clone https://github.com/microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
          fi
          
          ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh

      - name: Add NuGet sources
        shell: bash
        run: |
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            sources add \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${{ github.actor }}" \
            -Password "${{ secrets.GITHUB_TOKEN }}"
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            setapikey "${{ secrets.GITHUB_TOKEN }}" \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: ${{ github.job }}-ubuntu-latest

      - name: Prepare Flutter launcher shell
        working-directory: flutter_launcher
        run: |
          flutter create --platforms=android --android-language java .
          ./tool/sync_assets.sh

      - name: Move Android platform resources into Flutter launcher
        run: |
          mkdir -p flutter_launcher/android/app/src/main/res
          cp -R platforms/android/app/res/. flutter_launcher/android/app/src/main/res/
          mkdir -p flutter_launcher/android/app/src/main/assets
          cp -R ui/cocos-studio/. flutter_launcher/android/app/src/main/assets/
          mkdir -p flutter_launcher/android/app/src/main/java/org
          cp -R platforms/android/libsdl/java/src/org/libsdl flutter_launcher/android/app/src/main/java/org/
          cp -R platforms/android/libcocos2dx/java/src/org/cocos2dx flutter_launcher/android/app/src/main/java/org/
          mkdir -p flutter_launcher/android/app/src/main/java/org/tvp
          cp -R platforms/android/app/java/org/tvp/kirikiri2 flutter_launcher/android/app/src/main/java/org/tvp/
          mkdir -p flutter_launcher/android/app/src/main/java/org/github/krkr2
          cp platforms/android/app/java/org/github/krkr2/MainActivity.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/KR2Application.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/LauncherPrefs.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/LauncherSettingsDb.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/KrkrPrefsStore.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/KrkrPrefsSchema.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/KrkrPrefsCaptions.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/GamePrefsDb.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/GameScanner.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/ForceLandscapeHelper.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          mkdir -p flutter_launcher/android/app/libs
          cp platforms/android/libcocos2dx/java/libs/*.jar flutter_launcher/android/app/libs/
          mkdir -p flutter_launcher/android/app/src/main/aidl/com/enhance/gameservice
          cp platforms/android/libcocos2dx/java/src/com/enhance/gameservice/IGameTuningService.aidl flutter_launcher/android/app/src/main/aidl/com/enhance/gameservice/
          cp platforms/android/app/proguard-rules.pro flutter_launcher/android/app/proguard-rules.pro

      - name: Create Flutter launcher activity
        run: |
          mkdir -p flutter_launcher/android/app/src/main/java/org/github/krkr2
          cat > flutter_launcher/android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" android:minSdkVersion="30" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />

              <application
                  android:name=".KR2Application"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="KiriKiri Launcher"
                  android:requestLegacyExternalStorage="true"
                  android:resizeableActivity="true">
                  <meta-data android:name="flutterEmbedding" android:value="2" />
                  <meta-data android:name="android.app.lib_name" android:value="krkr2" />

                  <activity
                      android:name=".LauncherHostActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize|uiMode"
                      android:exported="false"
                      android:screenOrientation="userLandscape"
                      android:launchMode="singleTask"
                      android:theme="@style/Theme.KR2"
                      android:windowSoftInputMode="adjustPan" />
              </application>
          </manifest>
          EOF
          cp platforms/android/flutter/java/org/github/krkr2/LauncherHostActivity.java flutter_launcher/android/app/src/main/java/org/github/krkr2/


      - name: Force Flutter plugin compileSdk
        run: |
          cat >> flutter_launcher/android/build.gradle.kts <<'EOF'

          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension>("android") {
                      compileSdk = 36
                  }
              }
          }
          EOF

      - name: Wire native engine into Flutter Android app
        run: |
          cat > flutter_launcher/android/app/build.gradle.kts <<'EOF'
          import com.android.build.api.dsl.ApplicationExtension
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget
          import org.jetbrains.kotlin.gradle.dsl.KotlinAndroidProjectExtension

          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          extensions.configure<ApplicationExtension>("android") {
              namespace = "org.github.krkr2"
              compileSdk = 36
              ndkVersion = "28.0.13004108"

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  prefab = true
                  aidl = true
              }

              defaultConfig {
                  applicationId = "org.github.krkr2"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName

                  ndk {
                      abiFilters.clear()
                      abiFilters += "arm64-v8a"
                  }

                  externalNativeBuild {
                      cmake {
                          targets += listOf("krkr2")
                          abiFilters += listOf("arm64-v8a")
                          cppFlags += listOf("-fsigned-char")
                          arguments += listOf(
                              "-DANDROID_STL=c++_shared",
                              "-DANDROID=ON",
                              "-DENABLE_TESTS=OFF",
                              "-DBUILD_TOOLS=OFF",
                          )
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path = file("../../../CMakeLists.txt")
                      version = "3.31.1"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro",
                      )
                  }
              }

          }

          extensions.configure<KotlinAndroidProjectExtension>("kotlin") {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation(fileTree(mapOf("dir" to "libs", "include" to listOf("*.jar"))))
              implementation("com.google.oboe:oboe:1.9.3")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Build Flutter launcher APK
        working-directory: flutter_launcher
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload artifacts
        if: ${{ !env.ACT && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: flutter_launcher/build/app/outputs/flutter-apk/*.apk
