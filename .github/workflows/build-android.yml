name: Build Flutter Android

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["Code Format Check"]
    types: [ "completed" ]

permissions:
  contents: read
  packages: write

env:
  ANDROID_NDK_VERSION: "28.0.13004108"
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
  VCPKG_INSTALL_OPTIONS: "--debug"

jobs:
  build-android:
    # Allow manual runs (workflow_dispatch) and chained runs from
    # workflow_run. Manual runs have no workflow_run payload so we must not
    # gate solely on its conclusion.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.act/vcpkg
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.act/android-sdk
      ANDROID_NDK: ${{ github.workspace }}/.act/android-ndk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Fetch private Live2D SDK
        shell: bash
        env:
          LIVE2D_SDK_TOKEN: ${{ secrets.LIVE2D_SDK_TOKEN }}
        run: |
          RAW_SDK_FETCH_TOKEN="${LIVE2D_SDK_TOKEN:-}"
          SDK_FETCH_TOKEN="$(printf '%s' "$RAW_SDK_FETCH_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$SDK_FETCH_TOKEN" ]; then
            echo "::error::Set LIVE2D_SDK_TOKEN to a PAT that can read the private Live2D SDK submodule. The default GITHUB_TOKEN cannot read sibling private repositories."
            exit 1
          fi

          export SDK_FETCH_TOKEN
          LIVE2D_AUTH_HEADER="$(python3 - <<'PY'
          import base64
          import os
          token = os.environ["SDK_FETCH_TOKEN"]
          auth = base64.b64encode(f"x-access-token:{token}".encode("utf-8")).decode("ascii")
          print(f"AUTHORIZATION: basic {auth}")
          PY
          )"
          LIVE2D_SDK_URL="https://github.com/xiaocongyu66/KiriKiri-Live2D-SDK.git"

          rm -rf third_party/live2d-sdk
          GIT_TERMINAL_PROMPT=0 git -c "http.https://github.com/.extraheader=${LIVE2D_AUTH_HEADER}" \
            clone --depth 1 "$LIVE2D_SDK_URL" third_party/live2d-sdk

          test -f third_party/live2d-sdk/Core/include/Live2DCubismCore.h
          test -f third_party/live2d-sdk/Core/lib/android/arm64-v8a/libLive2DCubismCore.a
          echo "Live2D Core SDK ready."

      - name: Free disk space
        run: |
          echo "Initial disk usage:"
          df -h
      
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      
          echo "After cleanup:"
          df -h

      - name: Install Mono
        run: |
          sudo apt install ca-certificates gnupg
          sudo gpg --homedir /tmp --no-default-keyring --keyring /usr/share/keyrings/mono-official-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt update
          sudo apt install -y mono-complete

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison python3 nasm autoconf-archive autoconf automake libtool pkg-config
          
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 8.0
          echo "$HOME/.dotnet" >> $GITHUB_PATH

      - name: Setup JDK 17 (fixed version)  # 修复 520 错误，锁定版本，网络友好
        uses: actions/setup-java@v3
        with:
          java-version: '17.0.19+10'
          distribution: 'zulu'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download Android CommandLineTools
        if: steps.commandlinetools-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -f "${{ github.workspace }}/.act/commandlinetools-linux-10406996_latest.zip" ]; then
            wget -P ${{ github.workspace }}/.act https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          fi

      - name: Cache Android Commandline Tools
        uses: actions/cache@v4.2.3
        id: commandlinetools-cache
        with:
          path: ${{ github.workspace }}/.act/commandlinetools-linux-10406996_latest.zip
          key: commandlinetools-linux-10406996_latest

      - name: Install Android SDK/NDK
        run: |
          if [ ! -d "${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin" ]; then
            unzip -d ${{ github.workspace }}/.act ${{ github.workspace }}/.act/commandlinetools-linux-10406996_latest.zip
            mkdir -p ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest
            mv ${{ github.workspace }}/.act/cmdline-tools/* ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest
          fi
          
          yes | ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${{ env.ANDROID_SDK_ROOT }} --licenses
          
          ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${{ env.ANDROID_SDK_ROOT }} \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "cmake;3.31.1" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Set Android SDK/NDK Env
        run: |
          if [ ! -d "${{ env.ANDROID_NDK }}" ]; then
            ln -s ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }} ${{ env.ANDROID_NDK }}
          fi

          echo "ANDROID_NDK=${{ env.ANDROID_NDK }}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${{ env.ANDROID_SDK_ROOT }}" >> $GITHUB_ENV

      - name: Setup vcpkg
        run: |
          if [ ! -d "${{ env.VCPKG_ROOT }}" ]; then
            git clone https://github.com/microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
          fi
          
          ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh

      - name: Add NuGet sources
        shell: bash
        run: |
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            sources add \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${{ github.actor }}" \
            -Password "${{ secrets.GITHUB_TOKEN }}"
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            setapikey "${{ secrets.GITHUB_TOKEN }}" \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: ${{ github.job }}-ubuntu-latest

      - name: Prepare Flutter launcher shell
        working-directory: flutter_launcher
        run: |
          flutter create --platforms=android --android-language java .
          ./tool/sync_assets.sh

      - name: Move Android platform resources into Flutter launcher
        run: |
          mkdir -p flutter_launcher/android/app/src/main/res
          cp -R platforms/android/app/res/. flutter_launcher/android/app/src/main/res/
          mkdir -p flutter_launcher/android/app/src/main/assets
          cp -R ui/cocos-studio/. flutter_launcher/android/app/src/main/assets/
          mkdir -p flutter_launcher/android/app/src/main/java/org
          cp -R platforms/android/libsdl/java/src/org/libsdl flutter_launcher/android/app/src/main/java/org/
          cp -R platforms/android/libcocos2dx/java/src/org/cocos2dx flutter_launcher/android/app/src/main/java/org/
          mkdir -p flutter_launcher/android/app/src/main/java/org/tvp
          cp -R platforms/android/app/java/org/tvp/kirikiri2 flutter_launcher/android/app/src/main/java/org/tvp/
          mkdir -p flutter_launcher/android/app/src/main/java/org/github/krkr2
          cp platforms/android/app/java/org/github/krkr2/MainActivity.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/KR2Application.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/LauncherPrefs.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/LauncherSettingsDb.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/KrkrPrefsStore.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/KrkrPrefsSchema.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/KrkrPrefsCaptions.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/GamePrefsDb.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/GameScanner.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/ForceLandscapeHelper.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          cp platforms/android/app/java/org/github/krkr2/AngleDriverController.kt flutter_launcher/android/app/src/main/java/org/github/krkr2/
          mkdir -p flutter_launcher/android/app/libs
          cp platforms/android/libcocos2dx/java/libs/*.jar flutter_launcher/android/app/libs/
          mkdir -p flutter_launcher/android/app/src/main/aidl/com/enhance/gameservice
          cp platforms/android/libcocos2dx/java/src/com/enhance/gameservice/IGameTuningService.aidl flutter_launcher/android/app/src/main/aidl/com/enhance/gameservice/
          cp platforms/android/app/proguard-rules.pro flutter_launcher/android/app/proguard-rules.pro

      - name: Create Flutter launcher activity
        run: |
          mkdir -p flutter_launcher/android/app/src/main/java/org/github/krkr2
          cat > flutter_launcher/android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" android:minSdkVersion="30" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />

              <application
                  android:name=".KR2Application"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="KiriKiri Launcher"
                  android:requestLegacyExternalStorage="true"
                  android:resizeableActivity="true">
                  <meta-data android:name="flutterEmbedding" android:value="2" />
                  <meta-data android:name="android.app.lib_name" android:value="krkr2" />

                  <activity
                      android:name=".LauncherHostActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".GameMenuFlutterActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                      android:exported="false"
                      android:hardwareAccelerated="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:windowSoftInputMode="adjustResize" />

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize|uiMode"
                      android:exported="false"
                      android:screenOrientation="userLandscape"
                      android:launchMode="singleTask"
                      android:theme="@style/Theme.KR2"
                      android:windowSoftInputMode="adjustPan" />
              </application>
          </manifest>
          EOF
          cat > flutter_launcher/android/app/src/main/java/org/github/krkr2/GameMenuFlutterActivity.java <<'EOF'
          package org.github.krkr2;

          import io.flutter.embedding.android.FlutterActivity;

          public class GameMenuFlutterActivity extends FlutterActivity {
              @Override
              public String getInitialRoute() {
                  return "/game-menu";
              }
          }
          EOF
          cat > flutter_launcher/android/app/src/main/java/org/github/krkr2/LauncherHostActivity.java <<'EOF'
          package org.github.krkr2;

          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;

          import java.io.File;
          import java.util.HashMap;
          import java.util.Map;

          import androidx.annotation.NonNull;

          import io.flutter.embedding.engine.FlutterEngine;
          import io.flutter.embedding.android.FlutterActivity;
          import io.flutter.plugin.common.MethodChannel;

          public class LauncherHostActivity extends FlutterActivity {
              private static final String CHANNEL = "org.github.krkr2/platform";
              private static final String PREF = "krkr2_launcher";
              private static final String KEY_GAME_ROOT = "game_root";
              private static final String KEY_SCAN_DEPTH = "scan_depth";
              private static final String DEFAULT_GAME_ROOT = "/storage/emulated/0/krkr2pro";

              @Override
              public void configureFlutterEngine(@NonNull FlutterEngine flutterEngine) {
                  super.configureFlutterEngine(flutterEngine);
                  new MethodChannel(flutterEngine.getDartExecutor().getBinaryMessenger(), CHANNEL)
                      .setMethodCallHandler((call, result) -> {
                          switch (call.method) {
                              case "hasFileManagementPermission":
                                  result.success(hasFileManagementPermission());
                                  break;
                              case "requestFileManagementPermission":
                                  requestFileManagementPermission();
                                  result.success(null);
                                  break;
                              case "pickGameRoot":
                                  pickGameRoot();
                                  result.success(null);
                                  break;
                              case "launchGame":
                                  launchGame(call.argument("gameDir"), call.argument("launchFile"), call.argument("title"));
                                  result.success(null);
                                  break;
                              case "getGameRoot":
                                  result.success(prefs().getString(KEY_GAME_ROOT, DEFAULT_GAME_ROOT));
                                  break;
                              case "setGameRoot": {
                                  String path = call.argument("path");
                                  prefs().edit().putString(KEY_GAME_ROOT, path == null || path.trim().isEmpty() ? DEFAULT_GAME_ROOT : path.trim()).apply();
                                  result.success(null);
                                  break;
                              }
                              case "getScanDepth": {
                                  int depth = prefs().getInt(KEY_SCAN_DEPTH, 2);
                                  result.success(Math.max(1, Math.min(10, depth)));
                                  break;
                              }
                              case "getDiagnosticsInfo":
                                  result.success(getDiagnosticsInfo());
                                  break;
                              case "getLauncherSettings":
                                  result.success(getLauncherSettings());
                                  break;
                              case "updateLauncherSetting":
                                  updateLauncherSetting(call.argument("key"), call.argument("value"));
                                  result.success(null);
                                  break;
                              case "launchOriginalEngine":
                                  launchGame("", "", "");
                                  result.success(null);
                                  break;
                              case "openSettings":
                              case "openDiagnostics":
                                  openApplicationSettings();
                                  result.success(null);
                                  break;
                              default:
                                  result.notImplemented();
                                  break;
                          }
                      });
              }

              private SharedPreferences prefs() {
                  return getSharedPreferences(PREF, MODE_PRIVATE);
              }

              private boolean hasFileManagementPermission() {
                  return Build.VERSION.SDK_INT < Build.VERSION_CODES.R || Environment.isExternalStorageManager();
              }

              private void requestFileManagementPermission() {
                  Intent intent;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      intent = new Intent(
                          Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                          Uri.fromParts("package", getPackageName(), null)
                      );
                  } else {
                      intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.fromParts("package", getPackageName(), null));
                  }
                  startActivity(intent);
              }

              private void pickGameRoot() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(intent, 1001);
              }

              private void openApplicationSettings() {
                  Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.fromParts("package", getPackageName(), null));
                  startActivity(intent);
              }

              private void launchGame(String gameDir, String launchFile, String title) {
                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                  intent.putExtra(MainActivity.EXTRA_GAME_DIR, gameDir == null ? "" : gameDir);
                  intent.putExtra(MainActivity.EXTRA_GAME_TITLE, title == null ? "" : title);
                  if (launchFile != null && !launchFile.trim().isEmpty()) {
                      intent.putExtra(MainActivity.EXTRA_LAUNCH_FILE, launchFile.trim());
                  }
                  startActivity(intent);
              }

              private Map<String, Object> getDiagnosticsInfo() {
                  Map<String, Object> info = new HashMap<>();
                  File latest = LauncherPrefs.INSTANCE.latestUnifiedLogFile(this);
                  info.put("platform", "Android");
                  info.put("platformVersion", Build.VERSION.RELEASE + " (SDK " + Build.VERSION.SDK_INT + ")");
                  info.put("device", Build.MANUFACTURER + " " + Build.MODEL);
                  info.put("packageName", getPackageName());
                  info.put("fileManagementGranted", hasFileManagementPermission());
                  info.put("gameRoot", prefs().getString(KEY_GAME_ROOT, DEFAULT_GAME_ROOT));
                  info.put("scanDepth", Math.max(1, Math.min(10, prefs().getInt(KEY_SCAN_DEPTH, 2))));
                  info.put("logDir", LauncherPrefs.INSTANCE.getLogDir(this));
                  info.put("latestLog", latest == null ? "" : latest.getAbsolutePath());
                  info.put("fileLogEnabled", LauncherPrefs.INSTANCE.getFileLogEnabled(this));
                  info.put("nativeLogConfigured", latest != null && latest.exists());
                  return info;
              }

              private Map<String, Object> getLauncherSettings() {
                  Map<String, Object> settings = new HashMap<>();
                  settings.put("language", LauncherPrefs.INSTANCE.getLanguage(this));
                  settings.put("forceLandscape", LauncherPrefs.INSTANCE.getForceLandscape(this));
                  settings.put("useFfmpegImageDecoder", LauncherPrefs.INSTANCE.getUseFfmpegImageDecoder(this));
                  settings.put("ffmpegDecodeMode", LauncherPrefs.INSTANCE.getFfmpegDecodeMode(this));
                  settings.put("fileLogEnabled", LauncherPrefs.INSTANCE.getFileLogEnabled(this));
                  settings.put("fileLogAutoCleanup", LauncherPrefs.INSTANCE.getFileLogAutoCleanup(this));
                  settings.put("fileLogRetentionDays", LauncherPrefs.INSTANCE.getFileLogRetentionDays(this));
                  settings.put("scanDepth", LauncherPrefs.INSTANCE.getScanDepth(this));
                  return settings;
              }

              private void updateLauncherSetting(String key, Object value) {
                  if (key == null) return;
                  switch (key) {
                      case "language":
                          LauncherPrefs.INSTANCE.setLanguage(this, value == null ? "en" : value.toString());
                          break;
                      case "forceLandscape":
                          LauncherPrefs.INSTANCE.setForceLandscape(this, Boolean.TRUE.equals(value));
                          break;
                      case "useFfmpegImageDecoder":
                          LauncherPrefs.INSTANCE.setUseFfmpegImageDecoder(this, Boolean.TRUE.equals(value));
                          break;
                      case "ffmpegDecodeMode":
                          LauncherPrefs.INSTANCE.setFfmpegDecodeMode(this, value == null ? "software" : value.toString());
                          break;
                      case "fileLogEnabled":
                          LauncherPrefs.INSTANCE.setFileLogEnabled(this, Boolean.TRUE.equals(value));
                          break;
                      case "fileLogAutoCleanup":
                          LauncherPrefs.INSTANCE.setFileLogAutoCleanup(this, Boolean.TRUE.equals(value));
                          break;
                      case "fileLogRetentionDays":
                          LauncherPrefs.INSTANCE.setFileLogRetentionDays(this, toInt(value, LauncherPrefs.FILE_LOG_RETENTION_DEFAULT_DAYS));
                          break;
                      case "scanDepth":
                          LauncherPrefs.INSTANCE.setScanDepth(this, toInt(value, LauncherPrefs.SCAN_DEPTH_DEFAULT));
                          break;
                      default:
                          break;
                  }
              }

              private int toInt(Object value, int fallback) {
                  if (value instanceof Number) return ((Number) value).intValue();
                  if (value instanceof String) {
                      try {
                          return Integer.parseInt((String) value);
                      } catch (NumberFormatException ignored) {
                          return fallback;
                      }
                  }
                  return fallback;
              }
          }
          EOF

      - name: Force Flutter plugin compileSdk
        run: |
          cat >> flutter_launcher/android/build.gradle.kts <<'EOF'

          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension>("android") {
                      compileSdk = 36
                  }
              }
          }
          EOF

      - name: Wire native engine into Flutter Android app
        run: |
          cat > flutter_launcher/android/app/build.gradle.kts <<'EOF'
          import com.android.build.api.dsl.ApplicationExtension
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget
          import org.jetbrains.kotlin.gradle.dsl.KotlinAndroidProjectExtension

          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          extensions.configure<ApplicationExtension>("android") {
              namespace = "org.github.krkr2"
              compileSdk = 36
              ndkVersion = "28.0.13004108"

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  prefab = true
                  aidl = true
              }

              defaultConfig {
                  applicationId = "org.github.krkr2"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName

                  ndk {
                      abiFilters.clear()
                      abiFilters += "arm64-v8a"
                  }

                  externalNativeBuild {
                      cmake {
                          targets += listOf("krkr2")
                          abiFilters += listOf("arm64-v8a")
                          cppFlags += listOf("-fsigned-char")
                          arguments += listOf(
                              "-DANDROID_STL=c++_shared",
                              "-DANDROID=ON",
                              "-DENABLE_TESTS=OFF",
                              "-DBUILD_TOOLS=OFF",
                          )
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path = file("../../../CMakeLists.txt")
                      version = "3.31.1"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro",
                      )
                  }
              }

          }

          extensions.configure<KotlinAndroidProjectExtension>("kotlin") {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation(fileTree(mapOf("dir" to "libs", "include" to listOf("*.jar"))))
              implementation("com.google.oboe:oboe:1.9.3")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Build Flutter launcher APK
        working-directory: flutter_launcher
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload artifacts
        if: ${{ !env.ACT && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: flutter_launcher/build/app/outputs/flutter-apk/*.apk
