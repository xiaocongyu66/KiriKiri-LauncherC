plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    ndkVersion '28.0.13004108'
    compileSdk PROP_COMPILE_SDK_VERSION.toInteger()
    namespace 'org.github.krkr2'

    defaultConfig {
        applicationId 'org.github.krkr2'
        minSdkVersion PROP_MIN_SDK_VERSION
        targetSdkVersion PROP_TARGET_SDK_VERSION
        ndk {
            jobs Runtime.runtime.availableProcessors()
            abiFilters 'arm64-v8a' //, 'x86_64', 'armeabi-v7a'
        }


        externalNativeBuild {
            cmake {
                targets 'krkr2'
                cppFlags '-fsigned-char'
                arguments '-DANDROID_STL=c++_shared', '-DANDROID=ON'
            }
        }
        versionCode Integer.parseInt(new Date().format('yyyyMMddHH'))
        versionName '1.5.0'
    }

    externalNativeBuild {
        cmake {
            version '3.31.1'
            buildStagingDirectory '../../../out/android/cmake-build'
            path '../../../CMakeLists.txt'
        }
    }

    signingConfigs {
        release {
            def signPropsFile = file('sign.properties')
            if (signPropsFile.exists()) {
                def signProps = new Properties()
                signProps.load(new FileInputStream(signPropsFile))

                keyAlias = signProps['SIGN_KEY_ALIAS']
                keyPassword = signProps['SIGN_KEY_PASS']
                storePassword = signProps['SIGN_STORE_PASS']
                storeFile = file('sign.keystore')
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            debuggable true
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
            assets.srcDirs = ['../../../ui/cocos-studio']
        }
    }

    buildFeatures {
        prefab true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.15'
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a'
            universalApk = true
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def ver = defaultConfig.versionName
            def abi = filters.find { it.filterType == 'ABI' }?.identifier ?: 'all'
            outputFileName = "${rootProject.name}-$ver-${abi}.apk"
        }
    }
}

dependencies {
    implementation project(':sdl')
    implementation project(':cocos2dx')

    implementation 'com.google.oboe:oboe:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.6'
    implementation 'androidx.compose.foundation:foundation:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.material3:material3-window-size-class:1.3.1'
    implementation 'androidx.compose.material:material-icons-extended:1.7.6'
    implementation 'androidx.compose.runtime:runtime-livedata:1.7.6'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.6'
}
