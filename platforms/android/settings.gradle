pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProperties = file('local.properties')
        if (localProperties.exists()) {
            localProperties.withInputStream { properties.load(it) }
        }
        def sdk = properties.getProperty('flutter.sdk')
                ?: System.getenv('FLUTTER_ROOT')
                ?: System.getenv('FLUTTER_HOME')
        assert sdk != null: 'Set flutter.sdk in platforms/android/local.properties or FLUTTER_ROOT/FLUTTER_HOME'
        if (!localProperties.exists()) {
            localProperties.text = "flutter.sdk=${sdk.replace('\\', '\\\\')}\n"
        }
        return sdk
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }
}

rootProject.name = 'krkr2'

include ':sdl'
project(':sdl').projectDir = file('libsdl')
include ':cocos2dx'
project(':cocos2dx').projectDir = file('libcocos2dx')
include ':app'
project(':app').projectDir = file('app')
