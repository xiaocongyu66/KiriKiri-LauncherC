name: kirikiri_launcher
version: 0.1.0+1
publish_to: none
description: Flutter launcher UI for KiriKiri-LauncherC.

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cocos-studio/img/menu_icon.png
    - assets/cocos-studio/img/touch_icon.png
    - assets/cocos-studio/img/mouse_icon.png
    - assets/cocos-studio/img/keyboard_icon.png
    - assets/cocos-studio/img/windows_icon.png
    - assets/cocos-studio/img/exit_icon.png
    - assets/cocos-studio/img/about_icon.png
    - assets/cocos-studio/img/syssetting_btn_on.png
    - assets/cocos-studio/img/syssetting_btn_ff.png
  fonts:
    - family: NotoSansCJK
      fonts:
        - asset: assets/cocos-studio/NotoSansCJK-Regular.ttc
