name: kirikiri_launcher
version: 0.1.0+1
publish_to: none
description: Flutter launcher UI for KiriKiri-LauncherC.

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansCJK
      fonts:
        - asset: assets/cocos-studio/NotoSansCJK-Regular.ttc
